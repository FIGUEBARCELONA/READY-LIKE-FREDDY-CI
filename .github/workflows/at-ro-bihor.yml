name: Austria historical registry and Bihor reference
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/at-ro-bihor.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture public primary documents
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,zipfile,io,json,concurrent.futures,datetime
          p=pathlib.Path('references');p.mkdir()
          sources=[('at_registry2024.ods','https://www.statistik.at/fileadmin/pages/453/RegGemVz2024.ods'),('at_localities2024.ods','https://www.statistik.at/fileadmin/pages/405/Bev_Ortschaften_2024.ods'),('bihor161.pdf','https://bh.prefectura.mai.gov.ro/wp-content/uploads/sites/21/2024/04/OP-161-stabilire-numar-consilieri-locali-si-judeteni.pdf')]
          def fetch(x):
              name,url=x
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=30) as r:
                      final=r.geturl();assert r.status==200 and urllib.parse.urlsplit(final).scheme=='https' and urllib.parse.urlsplit(final).hostname==urllib.parse.urlsplit(url).hostname
                      b=r.read(25*1024*1024+1);assert 0<len(b)<=25*1024*1024
                  if name.endswith('.ods'):
                      with zipfile.ZipFile(io.BytesIO(b)) as z:
                          assert z.testzip() is None and len(set(z.namelist()))==len(z.namelist()) and sum(i.file_size for i in z.infolist())<=150*1024*1024 and 'content.xml' in z.namelist()
                  else:assert b.startswith(b'%PDF')
                  (p/name).write_bytes(b)
                  return {'filename':name,'url':url,'final_url':final,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              except Exception as e:return {'filename':name,'url':url,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:report=list(ex.map(fetch,sources))
          print(json.dumps(report));(p/'capture_report.json').write_text(json.dumps(report,indent=2)+'\n')
          assert any('sha256' in r for r in report)
          PY
      - name: Transfer verified documents
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-ro-bihor-reference
          path: references/
          retention-days: 1
          if-no-files-found: error
