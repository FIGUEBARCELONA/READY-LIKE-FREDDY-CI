name: F02-03 Slovenia SURS and Hunedoara historical source
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/si-surs-ro-hunedoara.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Capture original official publications
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,datetime,concurrent.futures,zipfile,io
          p=pathlib.Path('reference');p.mkdir();report=[]
          def get(name,u,hosts,kind):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 public statistical reference'}),timeout=25) as r:
                      f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).scheme=='https' and urllib.parse.urlsplit(f).hostname in hosts
                      b=r.read(20*1024*1024+1);assert 0<len(b)<=20*1024*1024
                  if kind=='xlsx':
                      with zipfile.ZipFile(io.BytesIO(b)) as z:assert 'xl/workbook.xml' in z.namelist() and z.testzip() is None
                  else:assert b.startswith(b'%PDF')
                  (p/name).write_bytes(b);report.append({'name':name,'url':u,'final_url':f,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()})
              except Exception as e:report.append({'url':u,'error':repr(e)})
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:
              fs=[ex.submit(get,'surs_2024.xlsx','https://www.stat.si/StatWeb/en/File/NewsAttachment/3702',{'stat.si','www.stat.si'},'xlsx'),ex.submit(get,'hunedoara.pdf','https://hd.prefectura.mai.gov.ro/wp-content/uploads/sites/53/2024/04/OP-122_2024-stabilire-numar-consilieri.pdf',{'hd.prefectura.mai.gov.ro'},'pdf')]
              for f in fs:f.result()
          (p/'capture_report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report));assert len([r for r in report if 'name' in r])==2
          PY
      - name: Custody transfer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: si-surs-ro-hunedoara
          path: reference/
          retention-days: 1
          if-no-files-found: error
