name: ISTAT 2023 official demographic source
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/istat-2023.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture published download page and national data
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, hashlib, zipfile, json, datetime, re
          from html.parser import HTMLParser
          out=pathlib.Path('references');out.mkdir()
          base='https://demo.istat.it/app/?a=2023&i=P02&l=it'
          def retrieve(url,limit):
              assert urllib.parse.urlsplit(url).hostname in ('demo.istat.it','www.istat.it')
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=40) as r:
                  final=r.geturl();assert r.status==200 and urllib.parse.urlsplit(final).scheme=='https' and urllib.parse.urlsplit(final).hostname in ('demo.istat.it','www.istat.it')
                  b=r.read(limit+1);assert 0<len(b)<=limit
              return b,final
          def record(name,url,b,final):
              p=out/name;p.write_bytes(b)
              return {'filename':name,'url':url,'final_url':final,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          b,final=retrieve(base,5*1024*1024); report=[record('istat_p02_2023.html',base,b,final)]
          html=b.decode('utf-8',errors='replace')
          class Links(HTMLParser):
              def __init__(self): super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if v and ('.zip' in v.lower() or 'download' in v.lower() or tag=='form'): self.links.append((tag,k,v))
          parser=Links();parser.feed(html)
          print('LINKS',json.dumps(parser.links,ensure_ascii=False)[:35000])
          links=[]
          for tag,k,v in parser.links:
              if k in ('href','src') and '.zip' in v.lower():
                  url=urllib.parse.urljoin(final,v)
                  if urllib.parse.urlsplit(url).hostname=='demo.istat.it' and urllib.parse.urlsplit(url).scheme=='https': links.append(url)
          print('ZIP_LINKS',json.dumps(links))
          for url in sorted(set(links)):
              name=urllib.parse.unquote(urllib.parse.urlsplit(url).path.split('/')[-1])
              if not re.search(r'(comuni|comunale|municipal|tutti|all|italia)',name,re.I): continue
              try:
                  data,f=retrieve(url,40*1024*1024)
                  assert data.startswith(b'PK')
                  p=out/name;p.write_bytes(data)
                  with zipfile.ZipFile(p) as z:
                      assert z.testzip() is None and len(set(z.namelist()))==len(z.namelist()) and sum(i.file_size for i in z.infolist())<=200*1024*1024
                      print('ZIP',name,z.namelist()[:20])
                  report.append(record(name,url,data,f))
              except Exception as e: print('HOLD',url,repr(e))
          (out/'capture_report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Transfer official source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: istat-2023-reference
          path: references/
          retention-days: 1
          if-no-files-found: error
