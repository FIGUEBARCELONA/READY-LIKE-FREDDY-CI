name: NUTS 2024 legal reference
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/nuts2024-reference.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and extract legal Annex I
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, ssl, hashlib, re, json, csv, pathlib, collections, datetime
          from html.parser import HTMLParser
          class Rows(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True); self.rows=[]; self.row=None; self.cell=None
              def handle_starttag(self, tag, attrs):
                  if tag=='tr': self.row=[]
                  elif tag in ('td','th') and self.row is not None: self.cell=[]
              def handle_data(self, data):
                  if self.cell is not None: self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag in ('td','th') and self.cell is not None:
                      self.row.append(' '.join(''.join(self.cell).split())); self.cell=None
                  elif tag=='tr' and self.row is not None: self.rows.append(self.row); self.row=None
          expected=dict(zip('AT BE BG CY CZ DE DK EE EL ES FI FR HR HU IE IT LT LU LV MT NL PL PT RO SE SI SK'.split(),[35,44,28,1,14,400,11,5,52,59,19,101,21,20,8,107,10,1,5,2,40,73,26,42,21,12,8]))
          urls=['https://eur-lex.europa.eu/eli/reg_del/2023/674/oj/eng','https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A32023R0674','https://publications.europa.eu/resource/celex/32023R0674?language=eng&format=html','https://eur-lex.europa.eu/eli/reg_del/2023/674/oj']
          out=pathlib.Path('legal-reference');out.mkdir()
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'Accept':'text/html,application/xhtml+xml','Accept-Language':'en','User-Agent':'Mozilla/5.0 RLF-CI legal-reference'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(12*1024*1024+1); final=r.geturl(); assert r.status==200 and len(raw)<=12*1024*1024
                      assert urllib.parse.urlsplit(final).scheme=='https' and urllib.parse.urlsplit(final).hostname in ('eur-lex.europa.eu','publications.europa.eu','op.europa.eu','publications.europa.eu')
                  p=Rows(); p.feed(raw.decode('utf-8-sig'))
                  codes=[]
                  for row in p.rows:
                      if len(row)!=4 or not re.fullmatch('[A-Z0-9]{5}',row[0]): continue
                      code=row[0]
                      if code[:2] in expected and not row[1] and not row[2] and row[3]: codes.append(code)
                  assert len(codes)==len(set(codes)), 'duplicates'
                  geo=collections.Counter(c[:2] for c in codes if not c.endswith('ZZZ'))
                  extra=sorted(c for c in codes if c.endswith('ZZZ'))
                  assert dict(geo)==expected, (len(codes),dict(geo))
                  assert extra==sorted(c+'ZZZ' for c in expected)
                  break
              except Exception as exc: print('source failure',url,repr(exc))
          else: raise SystemExit('No fully validated legal annex')
          (out/'regulation_2023_674.html').write_bytes(raw)
          with (out/'nuts2024_reference.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['NUTS_ID','LEVL_CODE','CATEGORY'])
              w.writerows((c,3,'EXTRA_REGIO' if c.endswith('ZZZ') else 'TERRITORIAL') for c in sorted(codes))
          report={'source_url':url,'final_url':final,'source_sha256':hashlib.sha256(raw).hexdigest(),'source_bytes':len(raw),'csv_sha256':hashlib.sha256((out/'nuts2024_reference.csv').read_bytes()).hexdigest(),'territorial':sum(geo.values()),'extra_regio':len(extra),'legal_codes':len(codes),'countries':dict(sorted(geo.items())),'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (out/'reference_report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report)); print('LEGAL_CODES='+' '.join(sorted(codes)))
          PY
      - name: Transfer public legal reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuts2024-legal-reference
          path: legal-reference/
          retention-days: 1
          if-no-files-found: error
