name: F02-03 Lithuanian historical statistics and Botosani
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/lt-vda-ro-botosani.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,datetime,concurrent.futures
          p=pathlib.Path('reference');p.mkdir();report=[]
          def get(name,u,hosts):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 public statistical reference'}),timeout=25) as r:
                      f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).scheme=='https' and urllib.parse.urlsplit(f).hostname in hosts
                      b=r.read(32*1024*1024+1);assert 0<len(b)<=32*1024*1024 and b.startswith(b'%PDF')
                  (p/name).write_bytes(b);report.append({'name':name,'url':u,'final_url':f,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()})
              except Exception as e:report.append({'name_attempted':name,'url':u,'error':repr(e)})
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:
              fs=[ex.submit(get,'lt_health_2023.pdf','https://www.hi.lt/uploads/Statistikos_leidiniai_Gyventoju_sveikata/leid2023.pdf',{'hi.lt','www.hi.lt'}),ex.submit(get,'botosani_order244.pdf','https://bt.prefectura.mai.gov.ro/wp-content/uploads/sites/25/2024/04/Ordin-al-Prefectului-244-din-09.04.2024-nr.membri-CL.pdf',{'bt.prefectura.mai.gov.ro'})]
              for f in fs:f.result()
          (p/'capture_report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lt-vda-ro-botosani
          path: reference/
          retention-days: 1
          if-no-files-found: error
