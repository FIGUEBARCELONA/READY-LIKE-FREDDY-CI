name: F02-03 Preserve Ilfov municipal strategy POP107D excerpt
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/fi-statfin-pop107d.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Capture original public municipal strategy
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,datetime
          p=pathlib.Path('reference');p.mkdir()
          u='https://primariabuftea.ro/pdf/strategie_2024.pdf'
          with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=35) as r:
              f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).scheme=='https' and urllib.parse.urlsplit(f).hostname in {'primariabuftea.ro','www.primariabuftea.ro'}
              b=r.read(64*1024*1024+1);assert b.startswith(b'%PDF') and len(b)<=64*1024*1024
          (p/'strategie_2024.pdf').write_bytes(b)
          d={'name':'strategie_2024.pdf','url':u,'final_url':f,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'MUNICIPAL_CONSULTATION_DOCUMENT_NOT_RAW_INS'}
          (p/'capture_report.json').write_text(json.dumps(d,indent=2));print(d)
          PY
      - name: Custody transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ro-ilfov-pop107d
          path: reference/
          retention-days: 1
          if-no-files-found: error
