name: Cyprus historic GEOCODES and final census
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/cy-cystat.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture official codes and final census metadata
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,concurrent.futures,datetime
          p=pathlib.Path('references');p.mkdir()
          root='https://cystatdb.cystat.gov.cy/pxweb/api/v1/en/8.CYSTAT-DB/'
          parts=['Population','Census of Population and Housing 2021','Population','Population - Place of Residence','1891114E.px']
          api=root+'/'.join(urllib.parse.quote(x,safe='') for x in parts)
          sources=[('geocodes2015.csv','https://www.data.gov.cy/sites/default/files/GEOCODES%202015.csv'),('final_metadata.json',api)]
          def fetch(x):
              name,url=x
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=30) as r:
                      final=r.geturl();assert r.status==200 and urllib.parse.urlsplit(final).scheme=='https' and urllib.parse.urlsplit(final).hostname in ('www.data.gov.cy','data.gov.cy','cystatdb.cystat.gov.cy')
                      b=r.read(12*1024*1024+1);assert 0<len(b)<=12*1024*1024
                  if name.endswith('.json'):
                      d=json.loads(b);assert 'variables' in d;print([(v['code'],v['text'],len(v['values']),v['values'][:6],v['valueTexts'][:6]) for v in d['variables']])
                  else: assert b'District Code' in b[:1000]
                  (p/name).write_bytes(b)
                  return {'name':name,'url':url,'final_url':final,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              except Exception as e:return {'name':name,'url':url,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:report=list(ex.map(fetch,sources))
          (p/'capture_report.json').write_text(json.dumps(report,indent=2)+'\n');print(report)
          assert any('sha256' in r for r in report)
          PY
      - name: Transfer official sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cy-geocodes-reference
          path: references/
          retention-days: 1
          if-no-files-found: error
