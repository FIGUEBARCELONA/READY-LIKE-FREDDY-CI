name: Cyprus historical census primary sources
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/cy-cystat.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve primary sources
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,zipfile,io,json,concurrent.futures,datetime
          p=pathlib.Path('references');p.mkdir()
          base='https://library.cystat.gov.cy/NEW/'
          original=base+'POP_CEN_21-PRE_RESULTS-MUNCOM_COMP-EN-040823.xlsx'
          sources=[('preliminary.xlsx',original),('codes2007.pdf',base+'STATISTICAL_CODES.pdf'),('press_preliminary.pdf',base+'Census2021-Preliminary_Results-EN-040823.pdf'),('press_final.pdf',base+'Census2021-Final_Results-EN-090824.pdf'),('archive_index.json','https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({'url':original,'output':'json','filter':'statuscode:200','from':'2023','to':'2024'}))]
          def fetch(x):
              name,url=x
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=30) as r:
                      final=r.geturl();assert r.status==200 and urllib.parse.urlsplit(final).scheme=='https' and urllib.parse.urlsplit(final).hostname in ('library.cystat.gov.cy','web.archive.org')
                      b=r.read(16*1024*1024+1);assert 0<len(b)<=16*1024*1024
                  if name.endswith('.xlsx'):
                      with zipfile.ZipFile(io.BytesIO(b)) as z:assert z.testzip() is None and len(set(z.namelist()))==len(z.namelist()) and sum(i.file_size for i in z.infolist())<=100*1024*1024 and 'xl/workbook.xml' in z.namelist()
                  elif name.endswith('.pdf'):assert b.startswith(b'%PDF')
                  else:print(json.loads(b))
                  (p/name).write_bytes(b)
                  return {'name':name,'url':url,'final_url':final,'sha256':hashlib.sha256(b).hexdigest(),'sha1':hashlib.sha1(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              except Exception as e:return {'name':name,'url':url,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:report=list(ex.map(fetch,sources))
          if not (p/'preliminary.xlsx').exists():
              report.append(fetch(('preliminary_archive.xlsx','https://web.archive.org/web/20230824103055id_/'+original)))
          (p/'capture_report.json').write_text(json.dumps(report,indent=2)+'\n');print(report)
          assert any('sha256' in r for r in report)
          PY
      - name: Transfer originals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cy-cystat-reference
          path: references/
          retention-days: 1
          if-no-files-found: error
