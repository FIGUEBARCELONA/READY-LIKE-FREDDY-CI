name: F02-03 Brașov contemporaneous administrative sources
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/f02-03-pop107d-direct.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,concurrent.futures
          p=pathlib.Path('reference');p.mkdir()
          sources={'prejmer.pdf':'https://primariaprejmer.ro/wp-content/uploads/HOTARARE-ADMITERE-CANDIDATI-CL-PARTIDUL-SOCIAL-DEMOCRAT.pdf','sanpetru.pdf':'https://primaria-sanpetru.ro/wp-content/uploads/2024/04/Hotararea-nr-3-din-2024.pdf','tarlungeni.pdf':'https://comunatarlungeni.ro/wp-content/uploads/2024/04/HBECTRLG-11-admitere-APRPE.pdf','sinca.pdf':'https://comunasinca.ro/wp-content/uploads/2024/04/Hotararea-nr.-2-din-25.04.2024-privind-admiterea-listei-de-candidati-pentru-functia-de-consilier-local-al-comunei-Sinca-din-partea-Asociatiei-Partida-Romilor-Pro-Europa.pdf'}
          def get(item):
              n,u=item
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 public statistical reference'}),timeout=25) as r:
                      f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).scheme=='https' and urllib.parse.urlsplit(f).hostname in {'primariaprejmer.ro','www.primariaprejmer.ro','primaria-sanpetru.ro','www.primaria-sanpetru.ro','comunatarlungeni.ro','www.comunatarlungeni.ro','comunasinca.ro','www.comunasinca.ro'}
                      b=r.read(16*1024*1024+1);assert 0<len(b)<=16*1024*1024 and b.startswith(b'%PDF')
                  (p/n).write_bytes(b);return {'name':n,'url':u,'final_url':f,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
              except Exception as e:return {'name':n,'url':u,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:report=list(ex.map(get,sources.items()))
          (p/'capture_report.json').write_text(json.dumps(report,indent=2));print(report)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brasov-historical-local
          path: reference/
          retention-days: 1
          if-no-files-found: error
