name: F02-03 POP107D 2024 direct and secondary evidence
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/f02-03-pop107d-direct.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,concurrent.futures,re
          p=pathlib.Path('reference');p.mkdir();report=[]
          root='http://statistici.insse.ro:8077/tempo-ins/'
          ids=set('41248 41284 41346 41382 41417 41471 41541 41578 41621 41667 41701 41738 41818 41854 41925 41943 42003 42058 42076 42101 42156 42183 42236 42307 42398 42449 42464'.split())
          def get(n,u,body=None):
              h={'User-Agent':'RLF-CI/1.0 public statistical reference','Accept':'application/json, text/plain, */*'}
              if body is not None:h.update({'Content-Type':'application/json','Origin':'http://statistici.insse.ro:8077','Referer':'http://statistici.insse.ro:8077/tempo-online/'})
              with urllib.request.urlopen(urllib.request.Request(u,data=None if body is None else json.dumps(body).encode(),headers=h),timeout=20) as r:
                  f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).hostname in {'statistici.insse.ro','ins.gov2.ro','mariuscomper.uk'}
                  b=r.read(12*1024*1024+1);assert 0<len(b)<=12*1024*1024
              if n.endswith('.json'):json.loads(b)
              (p/n).write_bytes(b);report.append({'name':n,'url':u,'final_url':f,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'transport':urllib.parse.urlsplit(f).scheme,'request':body});return b
          def direct():
              m=json.loads(get('ins_metadata.json',root+'matrix/POP107D?lang=ro'))
              selected=[]
              for d in m['dimensionsMap']:
                  opts=d['options'];label=d['label'].lower().strip()
                  if 'localitati' in label or 'localități' in label:
                      sel=[o for o in opts if o['label'].split()[0] in ids];assert len(sel)==27
                  elif 'judet' in label or 'județ' in label:
                      sel=[o for o in opts if o['label'].lower().strip() in ('brasov','brașov','braşov')]
                  elif 'ani'==label or 'timp' in label:
                      sel=[o for o in opts if o['label'].strip() in ('Anul 2024','2024')]
                  elif len(opts)==1:sel=opts
                  else:sel=[o for o in opts if o['label'].strip().lower()=='total']
                  assert sel,(label,opts[:5])
                  selected.append(sel)
              query={'language':'ro','encQuery':':'.join(','.join(str(o['nomItemId']) for o in s) for s in selected),'matCode':'POP107D','matMaxDim':m['details']['matMaxDim'],'matUMSpec':m['details']['matUMSpec'],'matRegJ':m['details'].get('matRegJ',0)}
              (p/'ins_query_selection.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2))
              get('ins_brasov_2024.csv',root+'pivot',query)
          def secondary():
              for code in ('POP107D','POP107D_localitati'):
                  try:
                      m=json.loads(get('mirror_'+code+'_metadata.json','https://ins.gov2.ro/api/datasets/'+code+'?lang=ro'))
                      print('MIRROR',code,list(m))
                  except Exception as e:report.append({'mirror':code,'error':repr(e)})
          def article():
              get('article.html','https://mariuscomper.uk/locuitori-pe-hartie/en/')
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              for label,f in [(fn.__name__,ex.submit(fn)) for fn in (direct,secondary,article)]:
                  try:f.result()
                  except Exception as e:report.append({'source':label,'error':repr(e)})
          (p/'capture_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(report)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pop107d-direct-capture
          path: reference/
          retention-days: 1
          if-no-files-found: error
