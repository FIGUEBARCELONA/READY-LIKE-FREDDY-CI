name: F02-03 FEK official alternative and Brasov annex
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/f02-03-review-fek.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,concurrent.futures
          p=pathlib.Path('reference');p.mkdir()
          sources={'fek_et.pdf':'https://www.et.gr/api/DownloadFeksApi/?fek_pdf=20230204821','fek_ministry.pdf':'https://www.ypes.gr/wp-content/uploads/2024/09/%CE%A5%CE%91-64436-20230731.pdf','brasov.pdf':'https://www.primaria-fagaras.ro/mb/hotarari/136_1.pdf'}
          def get(item):
              n,u=item
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 public statistical reference'}),timeout=25) as r:
                      f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).scheme=='https' and urllib.parse.urlsplit(f).hostname in {'www.et.gr','et.gr','search.et.gr','www.ypes.gr','ypes.gr','www.primaria-fagaras.ro','primaria-fagaras.ro'}
                      b=r.read(32*1024*1024+1);assert 0<len(b)<=32*1024*1024 and b.startswith(b'%PDF')
                  (p/n).write_bytes(b);return {'name':n,'url':u,'final_url':f,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
              except Exception as e:return {'name':n,'url':u,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:report=list(ex.map(get,sources.items()))
          (p/'capture_report.json').write_text(json.dumps(report,indent=2));print(report)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-fek-brasov
          path: reference/
          retention-days: 1
          if-no-files-found: error
