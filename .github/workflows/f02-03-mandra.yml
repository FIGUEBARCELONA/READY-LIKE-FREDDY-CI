name: F02-03 Mandra historical source custody
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/f02-03-mandra.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,concurrent.futures
          p=pathlib.Path('reference');p.mkdir()
          sources={'mandra_6.pdf':'https://www.comunamandra.ro/download/hot-6-bec-mandra-2024.pdf','mandra_4.pdf':'https://www.comunamandra.ro/download/hot-4-bec-mandra-2024.pdf','ins_april2024.pdf':'https://static.srr.ro/files/PDF/2024/2024-04/2024-04-07/popdom1ian2024r_0.pdf'}
          def get(item):
              n,u=item
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 public statistical reference'}),timeout=25) as r:
                      f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).scheme=='https' and urllib.parse.urlsplit(f).hostname in {'comunamandra.ro','www.comunamandra.ro','static.srr.ro'}
                      b=r.read(12*1024*1024+1);assert 0<len(b)<=12*1024*1024 and b.startswith(b'%PDF')
                  (p/n).write_bytes(b);return {'name':n,'url':u,'final_url':f,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
              except Exception as e:return {'name':n,'url':u,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:report=list(ex.map(get,sources.items()))
          (p/'capture_report.json').write_text(json.dumps(report,indent=2));print(report)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mandra-historical-custody
          path: reference/
          retention-days: 1
          if-no-files-found: error
