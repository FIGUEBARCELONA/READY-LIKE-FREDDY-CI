name: F02-03 Sweden official historical workbook and Dolj aggregate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/se-scb-ro-bn-ph.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download official published files
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, hashlib, json, datetime, concurrent.futures, zipfile, io
          p=pathlib.Path('reference');p.mkdir();report=[]
          def get(name,u,hosts,kind):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 public statistical reference'}),timeout=25) as r:
                      f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).scheme=='https' and urllib.parse.urlsplit(f).hostname in hosts
                      b=r.read(25*1024*1024+1);assert 0<len(b)<=25*1024*1024
                  if kind=='xlsx':
                      with zipfile.ZipFile(io.BytesIO(b)) as z:assert 'xl/workbook.xml' in z.namelist() and z.testzip() is None
                  else:assert b.startswith(b'%PDF')
                  (p/name).write_bytes(b);report.append({'name':name,'url':u,'final_url':f,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()})
              except Exception as e:report.append({'url':u,'error':repr(e)})
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              fs=[ex.submit(get,'scb_historical.xlsx','https://www.scb.se/contentassets/ef676b89b44d4bcbacce5b2d399065cd/be0101_folkmangdkom2024.xlsx',{'scb.se','www.scb.se'},'xlsx'),ex.submit(get,'scb_annual.xlsx','https://www.scb.se/contentassets/ef676b89b44d4bcbacce5b2d399065cd/be0101_tabhel2024.xlsx',{'scb.se','www.scb.se'},'xlsx'),ex.submit(get,'dolj_cnp.pdf','https://cnp.ro/wp-content/uploads/2025/05/Economia-judetului-Dolj.pdf',{'cnp.ro','www.cnp.ro'},'pdf')]
              for f in fs:f.result()
          (p/'capture_report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          assert (p/'scb_historical.xlsx').exists()
          PY
      - name: Custody transfer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scb-workbook-dolj
          path: reference/
          retention-days: 1
          if-no-files-found: error
