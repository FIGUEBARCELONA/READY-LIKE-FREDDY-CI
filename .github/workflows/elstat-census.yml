name: ELSTAT census primary workbooks
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/elstat-census.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture official workbooks
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, hashlib, zipfile, json, datetime
          out=pathlib.Path('references');out.mkdir()
          sources={'communities.xlsx':'https://www.statistics.gr/documents/20181/17286366/MON_PLI_DHM_KOIN_2021.xlsx/17bff52d-4fb3-6563-7d67-251116184f56','settlements.xlsx':'https://www.statistics.gr/documents/20181/17286366/MON_PLI_DHM_OIKISN_2021.xlsx/2b5a5f24-4083-ede5-7201-3c4fb109fb44'}
          report=[]
          for name,url in sources.items():
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=60) as r:
                  final=r.geturl();assert r.status==200 and urllib.parse.urlsplit(final).scheme=='https' and urllib.parse.urlsplit(final).hostname=='www.statistics.gr'
                  b=r.read(20*1024*1024+1);assert 0<len(b)<=20*1024*1024 and b[:4]==b'PK\x03\x04'
              p=out/name;p.write_bytes(b)
              with zipfile.ZipFile(p) as z:
                  assert len(z.namelist())==len(set(z.namelist())) and sum(i.file_size for i in z.infolist())<100*1024*1024 and z.testzip() is None
                  assert 'xl/workbook.xml' in z.namelist()
              row={'filename':name,'url':url,'final_url':final,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()};report.append(row);print(json.dumps(row))
          (out/'capture_report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Transfer statistical references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elstat-census-reference
          path: references/
          retention-days: 1
          if-no-files-found: error
