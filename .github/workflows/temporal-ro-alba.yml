name: F02-03 Romanian Alba historical aggregate custody
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/temporal-ro-alba.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,datetime
          p=pathlib.Path('reference');p.mkdir()
          u='https://cnp.ro/wp-content/uploads/2025/05/Economia-judetului-Alba.pdf'
          with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 public statistical reference'}),timeout=25) as r:
              f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).scheme=='https' and urllib.parse.urlsplit(f).hostname in {'cnp.ro','www.cnp.ro'}
              b=r.read(20*1024*1024+1);assert 0<len(b)<=20*1024*1024 and b.startswith(b'%PDF')
          (p/'alba.pdf').write_bytes(b)
          (p/'capture_report.json').write_text(json.dumps({'name':'alba.pdf','url':u,'final_url':f,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alba-historical-reference
          path: reference/
          retention-days: 1
          if-no-files-found: error
