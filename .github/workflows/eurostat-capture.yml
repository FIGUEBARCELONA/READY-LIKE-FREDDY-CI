          CERT
          openssl cms -encrypt -binary -aes-256-gcm -in capture/EU-27-LAU-2024-NUTS-2024.xlsx -outform DER -out encrypted-custody/original.xlsx.cms "$RUNNER_TEMP/rlf-recipient.crt"
          cp capture/transport_report.json encrypted-custody/
          sha256sum encrypted-custody/original.xlsx.cms
      - name: Transfer encrypted custody
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/f02-03-eurostat-capture' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eurostat-lau-2024-encrypted-custody
          path: encrypted-custody/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
