name: Hungary KSH historical gazetteer
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/hu-ksh.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture official 2024 gazetteer and EU code names
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, hashlib, zipfile, io, json, concurrent.futures
          out=pathlib.Path('references');out.mkdir()
          sources=[('ro_bn_2024_provisional.xlsx','https://bistrita.insse.ro/wp-content/uploads/2024/04/anexa_comunicat.xlsx',{'bistrita.insse.ro'}),('ksh_2024.xlsx','https://www.ksh.hu/docs/helysegnevtar/hnt_letoltes_2024.xlsx',{'www.ksh.hu','ksh.hu','www.ksh.gov.hu','ksh.gov.hu'}),('ro_nuts_ted.html','https://docs.ted.europa.eu/eforms/1.15/reference/code-lists/nuts-rou-lvl3.html',{'docs.ted.europa.eu'}),('tempo_index.json','https://web.archive.org/cdx/search/cdx?url=statistici.insse.ro%3A8077%2Ftempo-ins%2Fmatrix%2FPOP107D&from=2024&to=2025&output=json&filter=statuscode%3A200',{'web.archive.org'})]
          def fetch(x):
              name,url,hosts=x
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=35) as r:
                      final=r.geturl();assert r.status==200 and urllib.parse.urlsplit(final).scheme=='https' and urllib.parse.urlsplit(final).hostname in hosts
                      b=r.read(15*1024*1024+1);assert 0<len(b)<=15*1024*1024
                  if name.endswith('.xlsx'):
                      with zipfile.ZipFile(io.BytesIO(b)) as z:
                          assert z.testzip() is None and len(set(z.namelist()))==len(z.namelist()) and 'xl/workbook.xml' in z.namelist()
                  elif name.endswith('.json'): print('ARCHIVE_INDEX',json.loads(b))
                  (out/name).write_bytes(b)
                  return {'name':name,'source':url,'final_url':final,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
              except Exception as e:return {'name':name,'source':url,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as e: report=list(e.map(fetch,sources))
          print(json.dumps(report));(out/'capture_report.json').write_text(json.dumps(report,indent=2)+'\n')
          assert any('sha256' in x for x in report)
          PY
      - name: Transfer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hu-ksh-ro-nuts-bn-reference
          path: references/
          retention-days: 1
          if-no-files-found: error
