name: INE census 2021 adapted to NUTS 2024
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pt-ro-ph.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture INE 0012276
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,datetime
          p=pathlib.Path('reference');p.mkdir()
          u='https://www.ine.pt/ine/json_indicador/pindica.jsp?op=2&varcd=0012276&lang=PT'
          with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=40) as r:
              f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).scheme=='https' and urllib.parse.urlsplit(f).hostname in ('www.ine.pt','ine.pt')
              b=r.read(30*1024*1024+1);assert 0<len(b)<=30*1024*1024
          d=json.loads(b);assert d[0]['IndicadorCod']=='0012276' and '2021' in d[0]['Dados']
          (p/'ine_0012276.json').write_bytes(b)
          report={'url':u,'final_url':f,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'title':d[0]['IndicadorDsg']}
          (p/'ine_0012276_capture.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n');print(report)
          PY
      - name: Transfer verified INE reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ine-0012276-reference
          path: reference/
          retention-days: 1
          if-no-files-found: error
