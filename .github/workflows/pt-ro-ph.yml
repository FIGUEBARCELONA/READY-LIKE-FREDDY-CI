name: DGT legacy source read-only extraction
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pt-ro-ph.yml']
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Extract original legacy XLS tables with pinned parser
        run: |
          python3 -m venv /tmp/rlf-dgt
          /tmp/rlf-dgt/bin/pip install --disable-pip-version-check --no-cache-dir xlrd==2.0.2
          /tmp/rlf-dgt/bin/python - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,zipfile,io,json,xlrd
          out=pathlib.Path('parsed');out.mkdir()
          refs={2023:'b78574108fea9e991792f8023a27c6d4f0e6eb5c7495dcd8b8e4e61a8b843c60',2024:'a78796bf21e5edd37666cc53f3980e64bcff02af2374c6faaea36acbe3842f8a'}
          for year,h in refs.items():
              url=f'https://www.dgterritorio.gov.pt/sites/default/files/ficheiros-cartografia/InfExtra_Municipios_Freguesias_CAOP{year}.zip'
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=30) as r:
                  assert r.status==200 and urllib.parse.urlsplit(r.geturl()).scheme=='https' and urllib.parse.urlsplit(r.geturl()).hostname=='www.dgterritorio.gov.pt'
                  b=r.read(4*1024*1024+1)
              assert hashlib.sha256(b).hexdigest()==h
              with zipfile.ZipFile(io.BytesIO(b)) as z:
                  assert len(z.namelist())==1 and z.testzip() is None
                  name=z.namelist()[0];raw=z.read(name)
              w=xlrd.open_workbook(file_contents=raw)
              data={'source_zip_sha256':h,'source_xls_sha256':hashlib.sha256(raw).hexdigest(),'source_member':name,'parser_version':xlrd.__version__,'sheets':{}}
              for s in w.sheets():
                  print(year,s.name,s.nrows,s.ncols,[s.row_values(i) for i in range(min(5,s.nrows))])
                  data['sheets'][s.name]=[s.row_values(i) for i in range(s.nrows)]
              (out/f'caop{year}_rows.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Transfer derived table rows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dgt-legacy-rows
          path: parsed/
          retention-days: 1
          if-no-files-found: error
