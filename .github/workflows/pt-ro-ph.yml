name: Portugal INE DGT and Prahova historical reference
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pt-ro-ph.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture independently published sources
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,zipfile,io,json,concurrent.futures,datetime
          out=pathlib.Path('references');out.mkdir()
          sources=[
              ('ine_0011609.json','https://www.ine.pt/ine/json_indicador/pindica.jsp?op=2&varcd=0011609&lang=PT',{'www.ine.pt','ine.pt'}),
              ('caop2024.zip','https://www.dgterritorio.gov.pt/sites/default/files/ficheiros-cartografia/InfExtra_Municipios_Freguesias_CAOP2024.zip',{'www.dgterritorio.gov.pt','dgterritorio.gov.pt'}),
              ('caop2023.zip','https://www.dgterritorio.gov.pt/sites/default/files/ficheiros-cartografia/InfExtra_Municipios_Freguesias_CAOP2023.zip',{'www.dgterritorio.gov.pt','dgterritorio.gov.pt'}),
              ('prahova_provisional.pdf','https://cdn.observatorulph.ro/wp-content/uploads/2026/01/populatia-din-Prahova-pe-localitati.pdf',{'cdn.observatorulph.ro'})]
          def fetch(x):
              name,url,hosts=x
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=30) as r:
                      final=r.geturl();u=urllib.parse.urlsplit(final);assert r.status==200 and u.scheme=='https' and u.hostname in hosts
                      b=r.read(30*1024*1024+1);assert 0<len(b)<=30*1024*1024
                  if name.endswith('.zip'):
                      with zipfile.ZipFile(io.BytesIO(b)) as z:assert len(set(z.namelist()))==len(z.namelist()) and sum(i.file_size for i in z.infolist())<=150*1024*1024 and z.testzip() is None;print(name,z.namelist())
                  elif name.endswith('.json'):
                      data=json.loads(b);print(name,str(data)[:3500])
                  else:assert b.startswith(b'%PDF')
                  (out/name).write_bytes(b)
                  return {'name':name,'url':url,'final_url':final,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              except Exception as e:return {'name':name,'url':url,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:report=list(ex.map(fetch,sources))
          print(json.dumps(report));(out/'capture_report.json').write_text(json.dumps(report,indent=2)+'\n')
          assert any('sha256' in x for x in report)
          PY
      - name: Transfer references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pt-ro-ph-reference
          path: references/
          retention-days: 1
          if-no-files-found: error
