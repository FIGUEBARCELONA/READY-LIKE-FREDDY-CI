name: F02-03 Sălaj historical prefectural order
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ie-cso-ro-satu-mare.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,datetime
          p=pathlib.Path('reference');p.mkdir()
          u='https://www.simleusilvaniei.ro/wp-content/uploads/2024/04/Ordinul-nr.125.pdf'
          with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 statistical research'}),timeout=30) as r:
              f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).scheme=='https' and urllib.parse.urlsplit(f).hostname in {'www.simleusilvaniei.ro','simleusilvaniei.ro'}
              b=r.read(20*1024*1024+1);assert b.startswith(b'%PDF') and len(b)<=20*1024*1024
          (p/'salaj_order.pdf').write_bytes(b)
          (p/'capture_report.json').write_text(json.dumps({'name':'salaj_order.pdf','url':u,'final_url':f,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: salaj-order
          path: reference/
          retention-days: 1
          if-no-files-found: error
