name: GUS historical territorial population and Sibiu
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pl-gus-ro-sibiu.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture official sources
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,zipfile,io,json,concurrent.futures,datetime
          out=pathlib.Path('references');out.mkdir()
          sources=[('gus_2024.xlsx','https://stat.gov.pl/download/gfx/portalinformacyjny/en/defaultaktualnosci/3286/4/18/1/area_and_population_in_the_territorial_profile_in_2024_tables.xlsx',{'stat.gov.pl','www.stat.gov.pl'}),('sibiu_177.pdf','https://sb.prefectura.mai.gov.ro/wp-content/uploads/sites/28/2024/05/OP-177.pdf',{'sb.prefectura.mai.gov.ro'})]
          def fetch(x):
              name,url,hosts=x
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=40) as r:
                      final=r.geturl();assert r.status==200 and urllib.parse.urlsplit(final).scheme=='https' and urllib.parse.urlsplit(final).hostname in hosts
                      b=r.read(15*1024*1024+1);assert 0<len(b)<=15*1024*1024
                  if name.endswith('.xlsx'):
                      with zipfile.ZipFile(io.BytesIO(b)) as z:assert len(set(z.namelist()))==len(z.namelist()) and sum(i.file_size for i in z.infolist())<=100*1024*1024 and z.testzip() is None and 'xl/workbook.xml' in z.namelist()
                  else:assert b.startswith(b'%PDF')
                  (out/name).write_bytes(b)
                  return {'name':name,'url':url,'final_url':final,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              except Exception as e:return {'name':name,'url':url,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:report=list(ex.map(fetch,sources))
          print(json.dumps(report));(out/'capture_report.json').write_text(json.dumps(report,indent=2)+'\n')
          assert any('sha256' in x for x in report)
          PY
      - name: Transfer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pl-gus-ro-sibiu
          path: references/
          retention-days: 1
          if-no-files-found: error
