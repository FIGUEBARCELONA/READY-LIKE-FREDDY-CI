name: GUS 2023 legacy municipal table extraction
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pl-gus-ro-sibiu.yml']
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read verified original table 11
        run: |
          python3 -m venv /tmp/rlf-gus
          /tmp/rlf-gus/bin/pip install --disable-pip-version-check --no-cache-dir xlrd==2.0.2
          /tmp/rlf-gus/bin/python - <<'PY'
          import urllib.request,urllib.parse,hashlib,zipfile,io,xlrd,json,pathlib
          u='https://stat.gov.pl/download/gfx/portalinformacyjny/en/defaultaktualnosci/3286/3/35/1/population._size_and_structure_31.12.2023.zip'
          with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=45) as r:
              assert r.status==200 and urllib.parse.urlsplit(r.geturl()).hostname=='stat.gov.pl' and urllib.parse.urlsplit(r.geturl()).scheme=='https'
              b=r.read(20*1024*1024+1)
          assert hashlib.sha256(b).hexdigest()=='39bf4a36be71ff5881a873c8c002013b2a94ba1224e704541c59f99c75a7efb4'
          p=pathlib.Path('parsed');p.mkdir()
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              assert z.testzip() is None
              raw=z.read('tabela11.xls')
          w=xlrd.open_workbook(file_contents=raw)
          data={'archive_sha256':hashlib.sha256(b).hexdigest(),'member':'tabela11.xls','member_sha256':hashlib.sha256(raw).hexdigest(),'xlrd_version':xlrd.__version__,'sheets':{}}
          for s in w.sheets():
              print(s.name,s.nrows,s.ncols,[s.row_values(i) for i in range(min(7,s.nrows))])
              data['sheets'][s.name]=[s.row_values(i) for i in range(s.nrows)]
          (p/'gus_2023_table11.json').write_text(json.dumps(data,ensure_ascii=False))
          PY
      - name: Transfer derived rows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gus-2023-table11-rows
          path: parsed/
          retention-days: 1
          if-no-files-found: error
