name: SK historical statistics and PT DGAL official reference
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/sk-statdata.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture public statistical sources
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, hashlib, json, concurrent.futures, datetime
          p=pathlib.Path('reference');p.mkdir()
          sources=[
            ('sk_openapi.json','https://statdata.statistics.sk/public/api/dc/v3/api-docs'),
            ('ro_teleorman_2024.pdf','https://tr.prefectura.mai.gov.ro/wp-content/uploads/sites/24/2024/04/Ordin-stabilire-numar-consilieri-locali-pe-circumscriptii-electorale-pentru-alegerile-locale-din-9-iunie-2024.pdf')]
          def fetch(x):
              name,url=x
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=35) as r:
                      final=r.geturl();assert r.status==200 and urllib.parse.urlsplit(final).scheme=='https' and urllib.parse.urlsplit(final).hostname in {'statdata.statistics.sk','data.statistics.sk','portalautarquico.dgal.gov.pt','tr.prefectura.mai.gov.ro'}
                      b=r.read(30*1024*1024+1);assert 0<len(b)<=30*1024*1024
                  if name.endswith('.pdf'):assert b.startswith(b'%PDF')
                  else:
                      d=json.loads(b);print(name,str(d)[:2000])
                  (p/name).write_bytes(b)
                  return {'filename':name,'url':url,'final_url':final,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              except Exception as e:return {'filename':name,'url':url,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:report=list(ex.map(fetch,sources))
          print(json.dumps(report));(p/'capture_report.json').write_text(json.dumps(report,indent=2)+'\n')
          assert any('sha256' in x for x in report)
          PY
      - name: Transfer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sk-api-ro-teleorman-reference
          path: reference/
          retention-days: 1
          if-no-files-found: error
