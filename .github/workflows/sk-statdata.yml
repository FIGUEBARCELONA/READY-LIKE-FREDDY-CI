name: SK historical statistics and PT DGAL official reference
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/sk-statdata.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture public statistical sources
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, hashlib, json, concurrent.futures, datetime
          p=pathlib.Path('reference');p.mkdir()
          sources=[
            ('sk_metadata.json','https://statdata.statistics.sk/public/api/dc/opendata/cube/dataset/om7101rr'),
            ('sk_legacy.json','https://data.statistics.sk/api/v2/dataset/om7101rr/om7101rr_obc/2023/om7101rr_ukaz/om7101rr_poh?lang=en'),
            ('sk_dimensions.json','https://data.statistics.sk/api/v2/dimension/om7101rr/om7101rr_obc'),
            ('pt_dgal_2026.pdf','https://portalautarquico.dgal.gov.pt/ficheiros/?channel=a7187039-4863-4c6c-9ef0-1422b677728d&content_id=D0060CD0-097C-48C9-97E3-23F4015B9313&dtestate=2026-01-12111736&field=storage_image&filetype=pdf&lang=pt&schema=f7664ca7-3a1a-4b25-9f46-2056eef44c33&ver=1')]
          def fetch(x):
              name,url=x
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RLF-CI/1.0 statistical reference'}),timeout=35) as r:
                      final=r.geturl();assert r.status==200 and urllib.parse.urlsplit(final).scheme=='https' and urllib.parse.urlsplit(final).hostname in {'statdata.statistics.sk','data.statistics.sk','portalautarquico.dgal.gov.pt'}
                      b=r.read(30*1024*1024+1);assert 0<len(b)<=30*1024*1024
                  if name.endswith('.pdf'):assert b.startswith(b'%PDF')
                  else:
                      d=json.loads(b);print(name,str(d)[:2000])
                  (p/name).write_bytes(b)
                  return {'filename':name,'url':url,'final_url':final,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              except Exception as e:return {'filename':name,'url':url,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:report=list(ex.map(fetch,sources))
          print(json.dumps(report));(p/'capture_report.json').write_text(json.dumps(report,indent=2)+'\n')
          assert any('sha256' in x for x in report)
          PY
      - name: Transfer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sk-pt-reference
          path: reference/
          retention-days: 1
          if-no-files-found: error
