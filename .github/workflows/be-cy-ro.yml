name: CYSTAT final census retrieval
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/be-cy-ro.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect official PxWeb table and API root
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,hashlib,json,concurrent.futures
          p=pathlib.Path('references');p.mkdir()
          base='https://cystatdb.cystat.gov.cy'
          path='8.CYSTAT-DB/8.CYSTAT-DB__Population__Census of Population and Housing 2021__Population__Population - Place of Residence/1891114E.px/'
          urls=[('table.html',base+'/pxweb/en/'+urllib.parse.quote(path,safe='/')+'table/tableViewLayout2/'),('selection.html',base+'/pxweb/en/'+urllib.parse.quote(path,safe='/')),('api_root.json',base+'/pxweb/api/v1/en/'),('api_root_alt.json',base+'/api/v1/en/'),('api_table.json',base+'/pxweb/api/v1/en/'+urllib.parse.quote(path.rstrip('/'),safe='/'))]
          def get(x):
              name,u=x
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}),timeout=20) as r:
                      f=r.geturl();assert r.status==200 and urllib.parse.urlsplit(f).hostname=='cystatdb.cystat.gov.cy' and urllib.parse.urlsplit(f).scheme=='https'
                      b=r.read(20*1024*1024+1);assert 0<len(b)<=20*1024*1024
                  if name.endswith('.json'):print(name,str(json.loads(b))[:2000])
                  (p/name).write_bytes(b)
                  return {'name':name,'url':u,'final_url':f,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
              except Exception as e:return {'name':name,'url':u,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as e:report=list(e.map(get,urls))
          print(report);(p/'capture_report.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Transfer retrieved evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cy-final-retry
          path: references/
          retention-days: 1
          if-no-files-found: error
